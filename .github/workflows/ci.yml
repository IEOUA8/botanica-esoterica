name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install client deps
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-secret-key-for-github-actions-minimum-32-chars
      ADMIN_EMAIL: admin@ci-test.com
      ADMIN_PASSWORD: CiTestPassword123
      CLIENT_URL: http://localhost:5173
      DEMO_MODE: "true"
      SHIPPING_FLAT_RATE: "0"
      FREE_SHIPPING_THRESHOLD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: npm ci --prefix server

      - name: Run unit tests
        run: npx jest --testPathPatterns="__tests__/unit" --forceExit
        working-directory: server

      - name: Run integration tests
        run: npx jest --testPathPatterns="__tests__/integration" --forceExit
        working-directory: server

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: npm ci --prefix client

      - name: Run frontend tests
        run: npm test --prefix client

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit server dependencies
        run: npm audit --audit-level=high --prefix server
        continue-on-error: true

      - name: Audit client dependencies
        run: npm audit --audit-level=high --prefix client
        continue-on-error: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, test-backend, test-frontend]
    env:
      NODE_ENV: test
      DEMO_MODE: "true"
      JWT_SECRET: e2e-secret-key-for-github-actions-minimum-32-chars
      ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: TestPassword123
      CLIENT_URL: http://localhost:5173
      SHIPPING_FLAT_RATE: "0"
      FREE_SHIPPING_THRESHOLD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install all deps
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
